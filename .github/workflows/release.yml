name: Release apps

# Push a tag like v0.4.0 to build the offline Windows app + Android APK and publish them
# to a GitHub Release. File names are version-less so the site can link to
# releases/latest/download/<name>.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build offline bundle + package exe
        run: npm run electron:pack
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/StarVocab-Setup.exe
            dist/StarVocab-Portable.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci

      - name: Build offline web bundle
        run: npm run build:offline
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      - name: Generate Android project
        run: npx cap add android

      - name: App icons from assets/icon-only.png
        continue-on-error: true
        run: >
          npx --yes @capacitor/assets@3.0.5 generate --android
          --iconBackgroundColor '#6366F1' --iconBackgroundColorDark '#6366F1'
          --splashBackgroundColor '#f4f2ec' --splashBackgroundColorDark '#1c1b26'

      - name: Sync web assets + set version
        shell: bash
        run: |
          npx cap sync android
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/StarVocab.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/StarVocab.apk
          if-no-files-found: error

  publish:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* \
            --title "Star Vocab $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" files/* --clobber
